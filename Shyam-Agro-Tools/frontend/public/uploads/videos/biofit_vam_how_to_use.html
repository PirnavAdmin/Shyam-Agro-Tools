<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biofit VAM - How To Use Video Guide</title>
  <style>
    :root {
      --primary: #eab308;
      --primary-hover: #fde047;
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.92);
      --text: #f8fafc;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--text); }
    .video-container { position: relative; width: 100vw; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .slide-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 1; pointer-events: auto; background: #000; }
    .slide-stage img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
    .caption-overlay { position: absolute; bottom: 72px; left: 20px; right: 20px; background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 1rem 1.25rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); }
    .step-pill { display: inline-block; background: rgba(234, 179, 8, 0.25); color: #fde047; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.2rem 0.6rem; border-radius: 9999px; margin-bottom: 0.35rem; border: 1px solid rgba(234, 179, 8, 0.4); }
    .step-title { font-size: 1.15rem; font-weight: 700; color: #ffffff; line-height: 1.3; }
    .step-desc { font-size: 0.9rem; color: #cbd5e1; margin-top: 0.25rem; line-height: 1.4; }
    .controls-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.4)); display: flex; align-items: center; padding: 0 1.25rem; gap: 1rem; z-index: 20; }
    .play-btn { background: var(--primary); color: #000; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .progress-bar-track { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.25); border-radius: 3px; cursor: pointer; overflow: hidden; position: relative; }
    .progress-bar-fill { height: 100%; width: 100%; background: var(--primary); }
    .timer-display { font-size: 0.8rem; font-weight: 600; color: #94a3b8; min-width: 42px; }
  </style>
</head>
<body>
<div class="video-container">
  <div class="slide-stage">
    <img src="media_1787287488927.png" alt="Biofit VAM Product">
    <div class="caption-overlay">
      <span class="step-pill">Product Overview & Usage</span>
      <h2 class="step-title">Biofit VAM (Mycorrhizal Biofertilizer)</h2>
      <p class="step-desc">Endo-mycorrhizae biofertilizer that forms symbiotic associations with crop roots to expand water & nutrient absorption.</p>
    </div>
  </div>
  <div class="controls-bar">
    <button class="play-btn">❚❚</button>
    <div class="progress-bar-track"><div class="progress-bar-fill"></div></div>
    <span class="timer-display">0:12</span>
  </div>
</div>
</body>
</html>
